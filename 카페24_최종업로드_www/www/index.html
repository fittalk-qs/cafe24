.press-table__title{ text-align:left; }
.press-table td.press-table__title{ text-align:left; }
.press-table__pub{ width:150px; }
.press-table__date{ width:118px; color:var(--muted-color); font-variant-numeric:tabular-nums; }
.press-table__link{ color:var(--text-color); transition:color .25s ease; }
.press-table__link:hover,.press-table__link:focus-visible{ color:var(--color-primary); text-decoration:underline; text-underline-offset:3px; }
.press-table__nolink{ margin-left:8px; font-size:12px; color:var(--muted-color); white-space:nowrap; }
.press__pager{ margin-top:28px; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px; }
.press__pages{ display:flex; flex-wrap:wrap; gap:4px; }
.press__pagenum,.press__pagebtn{ min-width:38px; height:38px; padding:0 10px; font-size:14px; color:var(--muted-color);
  border:1px solid transparent; transition:color .25s ease, background .25s ease, border-color .25s ease; }
.press__pagenum:hover,.press__pagenum:focus-visible{ color:var(--color-primary); border-color:var(--line-color); }
.press__pagenum.is-current{ background:var(--color-primary); border-color:var(--color-primary); color:#fff; font-weight:700; }
.press__pagebtn{ border-color:var(--line-color); }
.press__pagebtn:hover:not(:disabled){ color:var(--color-primary); border-color:var(--color-primary); }
.press__pagebtn:disabled{ opacity:.35; cursor:default; }
@media (max-width:767px){
  /* 모바일 : 제목 중심 · 언론사와 날짜는 아래 한 줄 (가로 잘림 없음) */
  .press-table{ table-layout:auto; }
  .press-table thead{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .press-table,.press-table tbody,.press-table tr{ display:block; width:100%; }
  .press-table tr{ padding:14px 2px; border-bottom:1px solid var(--line-color); }
  .press-table td{ display:block; width:auto; padding:0; border:0; text-align:left; }
  .press-table td.press-table__num{ display:none; }
  .press-table__title{ display:block; font-size:15px; }
  .press-table td.press-table__pub,.press-table td.press-table__date{ display:inline; font-size:12.5px; color:var(--muted-color); }
  .press-table td.press-table__pub{ margin-top:6px; }
  .press-table td.press-table__pub::after{ content:" · "; }
}

/* 브랜드 TV : 16:9 영상 카드 (실제 <iframe>) · 데스크톱 2열 · 모바일 1열 */
.video-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(20px,2.4vw,32px); align-items:start; }
@media (max-width:1023px){ .video-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:767px){ .video-grid{ grid-template-columns:minmax(0,1fr); } }
.video-card{ min-width:0; display:flex; flex-direction:column; }
.video-card__thumb{ position:relative; display:block; width:100%; aspect-ratio:16 / 9; overflow:hidden; background:#0b1c2a; border:0; padding:0; cursor:pointer; }
.video-card__thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s var(--ease-out); }
.video-card__thumb:hover img,.video-card__thumb:focus-visible img{ transform:scale(1.04); }
.video-card__play{ position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; background:rgba(0,47,71,.82); color:#fff;
  display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,.28); transition:background var(--transition-speed) var(--ease), transform var(--transition-speed) var(--ease); }
.video-card__play svg{ width:30px; height:30px; margin-left:3px; }
.video-card__thumb:hover .video-card__play{ background:var(--color-primary); transform:scale(1.06); }
.video-card__frame{ position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden; }
.video-card__frame iframe,.video-card__frame video{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
.video-card__caption{ margin-top:14px; min-width:0; }
.video-card__title{ display:block; width:100%; padding:0; border:0; background:transparent; text-align:left; font-family:var(--font-body); font-size:16px; font-weight:700; line-height:1.55; color:var(--color-primary); cursor:pointer; overflow-wrap:anywhere; word-break:keep-all; }
.video-card__title:hover,.video-card__title:focus-visible{ text-decoration:underline; text-underline-offset:3px; }
.video-modal{ position:fixed; inset:0; z-index:1300; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(0,10,20,.92); }
.video-modal.is-open{ display:flex; }
.video-modal__box{ position:relative; width:min(1100px,100%); }
.video-modal__frame{ position:relative; width:100%; aspect-ratio:16 / 9; background:#000; }
.video-modal__frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
.video-modal__close{ position:absolute; right:0; top:-48px; width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; font-size:18px; color:#fff; border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.08); }
.video-modal__close:hover,.video-modal__close:focus-visible{ background:#fff; color:var(--color-primary); }
.video-modal__title{ margin-top:14px; font-size:15px; color:rgba(255,255,255,.85); text-align:center; word-break:keep-all; }
@media (max-width:767px){ .video-modal{ padding:56px 16px 16px; } .video-modal__close{ top:-46px; } }
.video-card__desc{ margin-top:6px; font-size:14px; color:var(--muted-color); }

/* 문서 · 버튼 줄 */
.sub-actions{ margin-top:20px; display:flex; flex-wrap:wrap; gap:10px; }

/* =========================================================================
   [15] 사업개요 전용 레이아웃 · 페이지별 자유 섹션
   ========================================================================= */
/* 사업개요 : 왼쪽 이미지 + 오른쪽 표 — 같은 grid 행에서 stretch 되어
   이미지 위쪽은 표 위쪽 라인, 아래쪽은 마지막(타입) 행 아래 라인과 일치합니다. (JS 높이 계산 없음) */
.overview{ display:grid; grid-template-columns:var(--overview-ratio,1.2fr 1fr);
  gap:clamp(28px,3.4vw,64px); align-items:stretch; }
.overview > *{ min-width:0; }
.overview--noimage{ grid-template-columns:minmax(0,1fr); }
.overview__visual{ width:100%; height:100%; min-height:260px; }
.overview__visual .media__img{ height:100%; object-fit:cover; }
@media (min-width:901px){ .overview__visual{ aspect-ratio:auto !important; } }   /* 데스크톱 : 비율 대신 표 높이를 따름 */
@media (max-width:900px){ .overview{ grid-template-columns:minmax(0,1fr); } .overview__visual{ height:auto; min-height:0; } }
.overview__info{ min-width:0; display:flex; flex-direction:column; }
.overview__table{ border-top:1px solid var(--color-primary); }
.overview__row{ display:grid; grid-template-columns:minmax(92px,.36fr) minmax(0,1fr); gap:14px;
  padding:15px 2px; border-bottom:1px solid var(--color-border); }
.overview__label{ font-size:13.5px; font-weight:600; color:var(--muted-color); }
.overview__value{ font-size:15px; font-weight:500; color:var(--text-color); line-height:1.6; overflow-wrap:anywhere; }
/* 안내 문구 : 표 높이 계산에서 제외, 표 아래 별도 배치 */
.sub-content > .overview + .overview__notice{ margin-top:16px; }
.overview__notice{ font-size:12.5px; line-height:1.8; color:var(--muted-color); }

/* 페이지별 자유 섹션 */
.sec-image{ width:100%; margin-inline:auto; }
.sec-imagetext{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);
  gap:clamp(24px,3vw,56px); align-items:center; }
.sec-imagetext--right > .sub-figure{ order:2; }
@media (max-width:900px){
  .sec-imagetext{ grid-template-columns:minmax(0,1fr); }
  .sec-imagetext--right > .sub-figure{ order:0; }
}
.sec-imagetext__title{ font-size:clamp(19px,2vw,26px); font-weight:700; letter-spacing:-.03em; color:var(--color-primary); }
.sec-imagetext__desc{ margin-top:12px; font-size:15px; line-height:1.9; color:var(--muted-color); }

/* =========================================================================
   [16] 메인페이지 섹션별 화면 높이 보정 (원스크롤)
   ------------------------------------------------------------------------
   각 섹션이 화면 한 장을 채우되, 내용은 헤더 높이를 고려해 가운데 정렬됩니다.
   ========================================================================= */
@media (min-width:1024px){
  .home-section.section{ padding:0; }
  .home-section:not(#visit-reservation) > .section__inner,
  .home-section > .type__inner,
  .home-section > .premium__inner{
    min-height:100vh;
    display:flex; flex-direction:column; justify-content:center;
    padding-top:calc(var(--header-height) + clamp(24px,4vh,56px));
    padding-bottom:clamp(36px,6vh,80px);
  }
  @supports (height:100svh){
    .home-section:not(#visit-reservation) > .section__inner,
    .home-section > .type__inner,
    .home-section > .premium__inner{ min-height:100svh; }
  }
  .type.home-section{ padding:0; min-height:100vh; }
  @supports (height:100svh){ .type.home-section{ min-height:100svh; } }
  .premium.home-section > .premium__inner{ padding-top:0; padding-bottom:0; justify-content:flex-start; }
}
/* 섹션에 도착한 뒤에 콘텐츠가 나타나도록, 도착 전에는 감춰둡니다 */
.home-section .anim{ visibility:hidden; }
.home-section.is-active .anim,
.home-section .anim.is-in{ visibility:visible; }
@media (prefers-reduced-motion:reduce){ .home-section .anim{ visibility:visible; } }

/* 소메뉴 대표 이미지 */
.sub-hero{ width:100%; }
.sub-hero--left,.sub-hero--right{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);
  gap:clamp(24px,3vw,56px); align-items:center; }
.sub-hero--right > .sub-hero__media{ order:2; }
@media (max-width:900px){
  .sub-hero--left,.sub-hero--right{ grid-template-columns:minmax(0,1fr); }
  .sub-hero--right > .sub-hero__media{ order:0; }
}
.sub-hero__media{ width:100%; }
.sub-hero__title{ font-size:clamp(19px,2vw,26px); font-weight:700; letter-spacing:-.03em; color:var(--color-primary); margin-bottom:12px; }
.sub-hero__desc{ font-size:15px; line-height:1.9; color:var(--muted-color); }

/* =========================================================================
   [17] 소메뉴 미디어 레이아웃 · 여백 정리
   ========================================================================= */
/* 제목 밴드와 본문 사이 여백 축소 */
.sub-head{ min-height:0; }
.sub-head__inner{ padding:clamp(64px,7vw,110px) 24px clamp(40px,5vw,64px); }
.sub-body__inner{ min-height:0; padding:clamp(52px,6vw,90px) 24px clamp(80px,9vw,140px); }
.sub-content > * + *{ margin-top:clamp(44px,5vw,88px); }

/* 이미지 카드 그리드 (특화상품 · 시설 소개 · SYSTEM 등) */
.feature-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));
  gap:clamp(32px,3.4vw,56px);
}
.feature-grid--3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
@media (max-width:900px){ .feature-grid--3{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:600px){
  .feature-grid,.feature-grid--3{ grid-template-columns:minmax(0,1fr); gap:clamp(48px,9vw,64px); }
}
.feature-card{ min-width:0; display:flex; flex-direction:column; }
.feature-card__media{ width:100%; aspect-ratio:3/2; }
.feature-card__content{ padding-top:26px; }
.feature-card__number{ display:block; font-family:var(--font-display); font-size:12.5px; font-weight:600;
  letter-spacing:.2em; color:var(--color-primary-light); margin-bottom:10px; }
.feature-card__title{ font-size:clamp(17px,1.8vw,21px); font-weight:700; letter-spacing:-.025em; color:var(--color-primary); }
.feature-card__desc{ margin-top:10px; font-size:14.5px; line-height:1.8; color:var(--muted-color); }

/* 이미지 개수에 따라 자동 정렬되는 그리드 */
.image-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:clamp(24px,3vw,48px); }
.image-grid--single{ grid-template-columns:minmax(0,1fr); }
@media (max-width:600px){ .image-grid{ grid-template-columns:minmax(0,1fr); } }

/* VR · 3D */
.vr-block__media{ width:100%; aspect-ratio:16/9; }
.sub-actions .btn.is-disabled{ opacity:.45; pointer-events:none; }

/* 문서(이동통신설비 · 분양광고) : 상단 문서 이미지와 문서별 미리보기 이미지가 같은 콘텐츠 폭 · 같은 비율 */
.doc-stack{ display:flex; flex-direction:column; gap:clamp(24px,3vw,40px); }
.doc-preview{ width:100%; }
.doc-card{ min-width:0; }
.doc-card__media{ width:100%; }
.doc-card__row{ margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 2px;
  border-top:1px solid var(--line-color); border-bottom:1px solid var(--line-color); }
.doc-card__info{ min-width:0; }
.doc-card__name{ display:block; font-size:16px; font-weight:600; color:var(--color-primary); overflow-wrap:anywhere; }
.doc-card__meta{ display:block; margin-top:4px; font-size:12.5px; color:var(--muted-color); }
.doc-card__row .btn{ flex:0 0 auto; }
.doc-card__row .btn.is-disabled{ opacity:.45; pointer-events:none; }

/* 자유 섹션 layout 확장 */
.sec-imagetext--top{ grid-template-columns:minmax(0,1fr); }
.sec-imagetext--full{ grid-template-columns:minmax(0,1fr); }
.sec-imagetext--full .sub-figure__media{ aspect-ratio:21/9; }

/* =========================================================================
   [18] 모바일 여백 정리 · 슬라이드 도트
   ========================================================================= */
.type__dot{
  display:block; width:10px; height:10px; min-width:10px; min-height:10px;
  aspect-ratio:1/1; flex:0 0 10px; padding:0; border:0; border-radius:50%;
  box-sizing:border-box; background:rgba(255,255,255,.32);
  transition:background var(--transition-speed) var(--ease), transform var(--transition-speed) var(--ease);
}
.type__dot.is-active{ width:10px; height:10px; background:#fff; transform:scale(1.2); }
.type__dots{ display:flex; align-items:center; justify-content:center; gap:10px; }
.type__controls{ display:flex; align-items:center; justify-content:center; }

@media (max-width:767px){
  /* 모바일에서는 풀페이지 100svh 규칙을 적용하지 않습니다 */
  .home-section,
  .home-section__inner,
  .type.home-section,
  .type__inner,
  .type__stage{ height:auto; min-height:0; }
  .type.home-section{ padding:72px 0 calc(72px + env(safe-area-inset-bottom)); }
  .type__inner{ display:block; }
  .type__controls{ margin-top:24px; }
  .sub-head__inner{ padding:44px 20px 34px; }
  .sub-body__inner{ padding:44px 20px 72px; }
  .sub-content > * + *{ margin-top:clamp(40px,9vw,64px); }
}

/* =========================================================================
   [20] 이미지 · 여백 최종 정리
   ========================================================================= */
/* 실제 이미지 표시 규칙 */
.environment-card__image,
.overview__visual .media__img,
.feature-card__media .media__img,
.sub-figure__media .media__img,
.sub-hero__media .media__img,
.wbnote-gallery__item .media__img{
  display:block; width:100%; height:100%; object-fit:cover; object-position:center;
}
/* 이미지 요소가 아예 없는 영역만 제거 */
.sub-figure:not(:has(img)),
.sub-hero:not(:has(img)){ display:none !important; margin:0; padding:0; min-height:0; }
.content-image-wrap,.content-image-link{ display:block; width:100%; overflow:hidden; }
.content-image{ display:block; width:100%; height:100%; object-fit:cover; object-position:center; }

/* 안내 메시지 (페이지를 찾을 수 없을 때만 사용) */
.sub-message{ padding:clamp(28px,4vw,48px) 0; }
.sub-message__title{ font-size:18px; font-weight:700; color:var(--color-primary); }
.sub-message__text{ margin-top:10px; font-size:14px; line-height:1.9; color:var(--muted-color); }

/* 소메뉴 여백 축소 */
.sub-head__inner{ padding:56px 24px 44px; }
.sub-body__inner{ min-height:0; padding:56px 24px 80px; }
.sub-content{ min-height:0; }
.sub-content > * + *{ margin-top:clamp(32px,4vw,64px); }
@media (max-width:767px){
  .sub-head__inner{ padding:38px 20px 30px; }
  .sub-body__inner{ padding:40px 20px 64px; }
  .sub-content > * + *{ margin-top:36px; }
}

/* =========================================================================
   [21] 평면정보 레이아웃
   ========================================================================= */
.floor-plan-content{
  display:grid; grid-template-columns:minmax(0,1.15fr) minmax(380px,.85fr);
  gap:clamp(36px,5vw,80px); align-items:start;
}
@media (max-width:1023px){
  /* 모바일 : 이미지 먼저, 정보는 아래 */
  .floor-plan-content{ grid-template-columns:minmax(0,1fr); gap:28px; }
}
.floor-plan-image{
  display:block; width:100%; aspect-ratio:4 / 3; overflow:hidden;
  background:var(--color-background-soft); position:relative;
}
.floor-plan-image img{ width:100%; height:100%; object-fit:contain; }
.floor-plan-info{ min-width:0; }
.floor-plan-info,.floor-plan-info *{ word-break:keep-all; overflow-wrap:normal; }
.floor-plan-info__name{ font-size:clamp(22px,2.4vw,32px); font-weight:700; letter-spacing:-.03em;
  color:var(--color-primary); margin-bottom:20px; }
.floor-plan-info__table{ border-top:1px solid var(--color-primary); }
.floor-plan-info__row{ display:grid; grid-template-columns:minmax(110px,.42fr) minmax(0,1fr);
  gap:14px; padding:15px 2px; border-bottom:1px solid var(--color-border); min-width:0; }
.floor-plan-info__row dt{ font-size:13.5px; font-weight:600; color:var(--muted-color); white-space:nowrap; }
.floor-plan-info__row dd{ margin:0; min-width:0; white-space:normal; font-size:15px; font-weight:500; color:var(--text-color); }

/* =========================================================================
   [18] 공통 이미지 컴포넌트 (모든 소메뉴 공통)
   ------------------------------------------------------------------------
   · .content-card : 이미지(위) + 번호/태그 + 제목 + 설명   (특화상품 · 시설 · 범례 · VALUE · 품목 등)
   · .media-row    : 이미지(왼쪽) + 텍스트(오른쪽) 가로 행   (입지환경 항목 · 분양일정 · SYSTEM · 교통)
   · .sub-hero     : 페이지 대표 이미지 (top/bottom 은 가로형, left/right 는 텍스트와 2열)
   ========================================================================= */
.content-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:clamp(30px,3.4vw,56px) clamp(24px,3vw,44px); }
.content-grid--2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.content-grid--3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.content-grid--4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
@media (max-width:1023px){ .content-grid--4{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:900px){ .content-grid--3{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:600px){
  .content-grid,.content-grid--2,.content-grid--3,.content-grid--4{ grid-template-columns:minmax(0,1fr); gap:clamp(40px,8vw,56px); }
}
.content-card{ min-width:0; display:flex; flex-direction:column; }
.content-card__media{ width:100%; }
.content-card__text{ padding-top:22px; }
.content-card__number{ display:block; font-family:var(--font-display); font-size:12.5px; font-weight:600;
  letter-spacing:.2em; color:var(--color-primary-light); margin-bottom:10px; }
.content-card__tag{ font-family:var(--font-display); font-size:12px; font-weight:600; letter-spacing:.2em;
  color:var(--color-primary-light); margin-bottom:8px; }
.content-card__title{ font-size:clamp(17px,1.8vw,21px); font-weight:700; letter-spacing:-.025em; color:var(--color-primary); }
.content-card__desc{ margin-top:10px; font-size:14.5px; line-height:1.8; color:var(--muted-color); }
.sub-value.content-card{ padding:0; background:transparent; }
.sub-value.content-card .content-card__text{ padding:20px 22px 24px; background:var(--background-alt); flex:1; }

.media-list{ display:flex; flex-direction:column; border-top:1px solid var(--line-color); }
.media-row{ display:grid; grid-template-columns:minmax(150px,.26fr) minmax(0,1fr); gap:clamp(18px,2.8vw,40px);
  align-items:center; padding:clamp(20px,2.8vw,32px) 2px; border-bottom:1px solid var(--line-color); }
.media-row__media{ width:100%; }
.media-row__text{ min-width:0; }
.media-row__no{ display:block; font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--color-primary-light); margin-bottom:6px; }
.media-row__tag{ font-family:var(--font-display); font-size:12px; font-weight:600; letter-spacing:.2em; color:var(--color-primary-light); margin-bottom:6px; }
.media-row__title{ font-size:18px; font-weight:700; letter-spacing:-.025em; color:var(--color-primary); }
.media-row__desc{ margin-top:8px; font-size:14.5px; line-height:1.85; color:var(--muted-color); }
@media (max-width:600px){
  .media-row{ grid-template-columns:minmax(0,1fr); gap:16px; }
}

/* 문서 목록 : 문서마다 썸네일 */
.sub-doc{ align-items:center; }
.sub-doc__thumb{ width:64px; flex:none; border:1px solid var(--line-color); }
.sub-doc__info{ flex:1; min-width:0; }
@media (max-width:600px){ .sub-doc{ flex-wrap:wrap; } .sub-doc__info{ flex-basis:calc(100% - 80px); } }

/* 관심고객등록 페이지의 폼 : 배경 없이 콘텐츠 폭 안에서 상담 정보 + 폼 */
.reserve--page{ background:transparent; }
.reserve--page .reserve__layout{ margin-top:0; }

/* 페이지 대표 이미지 (top / bottom) */
.sub-hero--top .sub-hero__media,.sub-hero--bottom .sub-hero__media{ width:100%; }
.sub-hero--left,.sub-hero--right{ align-items:center; }
.sub-hero__text{ min-width:0; }

/* 항공 VR · e모델하우스 : 썸네일 아래 iframe */
.vr-block .sub-frame{ margin-top:24px; }
/* 평면정보 이미지 (contain) */
.floor-plan-image.editable-image{ background:var(--surface-color); border:1px solid var(--line-color); }
/* 이미지 확대 모달 */
.modal__media{ background:#000; }
.modal__media.editable-image::after{ display:none; }
/* 조감도 · 프리미엄 · 타입 배경 등 배경형 이미지는 영역 비율 지정 없음 */
.home-section__bg.editable-image,.premium__bg.editable-image,.type__bg.editable-image,.reserve__bg.editable-image{ aspect-ratio:auto; }

/* =========================================================================
   [22] 입지환경 · 단지설계 · 하이퍼트 페이지 (siteContent 공통 데이터 · 텍스트는 HTML · 이미지는 실제 <img>)
   ========================================================================= */
.page-head{ text-align:center; max-width:820px; margin:0 auto; }
.page-head--latin-only + .design-figure{ margin-top:clamp(18px,2.4vw,28px); }   /* ICON OF MOKDONG 바로 아래 원본 이미지 */
.page-head__latin{ font-family:var(--font-display); font-size:clamp(12px,1.1vw,14px); letter-spacing:.32em; text-transform:uppercase; color:var(--primary-light); }
.page-head__title{ margin-top:12px; font-size:clamp(26px,3.2vw,42px); font-weight:600; letter-spacing:-.03em; line-height:1.3; color:var(--primary-color); }
.page-head__desc{ margin:16px auto 0; font-size:clamp(14.5px,1.1vw,16px); line-height:1.9; color:var(--muted-color); word-break:keep-all; }
/* 입지환경 */
.loc-figure{ border:1px solid var(--line-color); background:var(--background-alt); }
.loc-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 clamp(24px,3vw,56px); border-top:1px solid var(--line-color); }
@media (max-width:767px){ .loc-list{ grid-template-columns:minmax(0,1fr); } }
.loc-item{ padding:20px 2px; border-bottom:1px solid var(--line-color); }
.loc-item__tag{ font-family:var(--font-display); font-size:12px; font-weight:600; letter-spacing:.22em; color:var(--primary-light); }
.loc-item__text{ margin-top:8px; font-size:15px; line-height:1.85; color:var(--text-color); word-break:keep-all; }
/* 단지설계 */
.design-figure{ border:0; }
.design-points{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(16px,2vw,28px); text-align:center; }
@media (max-width:767px){ .design-points{ grid-template-columns:minmax(0,1fr); } }
.design-point{ padding:clamp(22px,3vw,34px) clamp(16px,2vw,26px); background:var(--background-alt); }
.design-point__title{ font-size:clamp(17px,1.6vw,20px); font-weight:700; letter-spacing:-.02em; color:var(--primary-color); }
.design-point__desc{ margin-top:10px; font-size:14.5px; line-height:1.8; color:var(--muted-color); word-break:keep-all; }
.design-landscape{ text-align:center; }
.design-landscape__title{ font-size:clamp(19px,2vw,26px); font-weight:600; letter-spacing:-.03em; color:var(--primary-color); }
.design-landscape__list{ margin-top:16px; display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
.design-landscape__item{ display:inline-flex; align-items:center; min-height:44px; padding:0 22px; font-size:15px; font-weight:500; color:var(--primary-color); border:1px solid var(--primary-color); }
/* 하이퍼트 */
.hypert-visual{ border:0; }
.hypert-core{ text-align:center; }
.hypert-core__title{ font-family:var(--font-display); font-size:clamp(22px,2.6vw,34px); letter-spacing:.06em; color:var(--primary-color); }
.hypert-values{ margin-top:clamp(24px,3vw,40px); display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(28px,3.4vw,48px) clamp(24px,3vw,40px); text-align:left; }
@media (max-width:767px){ .hypert-values{ grid-template-columns:minmax(0,1fr); } }
.hypert-value{ min-width:0; display:flex; flex-direction:column; }
.hypert-value__media{ width:100%; }
.hypert-value__text{ padding-top:20px; }
.hypert-value__no{ font-family:var(--font-display); font-size:13px; letter-spacing:.2em; color:var(--primary-light); }
.hypert-value__en{ margin-top:6px; font-family:var(--font-display); font-size:clamp(15px,1.3vw,18px); letter-spacing:.08em; color:var(--primary-light); }
.hypert-value__ko{ margin-top:6px; font-size:clamp(19px,1.9vw,24px); font-weight:700; letter-spacing:-.03em; color:var(--primary-color); }
.hypert-value__desc{ margin-top:10px; font-size:15px; line-height:1.85; color:var(--muted-color); word-break:keep-all; }
.hypert-footnote{ padding:20px 22px; text-align:center; font-size:14px; line-height:1.8; color:var(--muted-color); background:var(--background-alt); border-top:1px solid var(--primary-color); }


/* =========================================================================
   [23] 상세 안내 이미지 규격 · 확대 보기 · 문서 페이지 · 오시는길 · 브랜드 · 탭 이미지 (2026-09-15 6차)
   · 정보형 이미지(.detail-content-image) : 원본 비율 · width:100% · height:auto · max-width 1200px(원본 폭 이하) · contain · 고정 높이 없음
   ========================================================================= */
.detail-figure{ margin:0; text-align:center; }
.detail-figure .detail-content-image-wrap{ display:block; width:100%; max-width:1200px; margin:0 auto; aspect-ratio:auto !important; overflow:visible; background:transparent; }
.detail-figure .editable-image__picture{ position:static; width:100%; height:auto; display:block; }
.detail-content-image{ position:static !important; display:block; width:100%; max-width:1200px; height:auto !important; margin:0 auto; object-fit:contain !important; transform:none !important; }
.detail-figure .detail-content-image-wrap:hover .detail-content-image{ transform:none; filter:none; }
/* 로딩 실패 : placeholder 를 16:9 로만 표시 (컨테이너 높이 과다 방지) */
.detail-figure .is-broken .detail-content-image{ aspect-ratio:16 / 9; max-height:320px; }
.detail-figure--zoom .detail-content-image-wrap{ cursor:zoom-in; }
.detail-figure__hint{ margin-top:10px; font-size:12.5px; color:var(--muted-color); }
.detail-stack{ display:flex; flex-direction:column; gap:clamp(24px,3vw,40px); }
.sub-notes{ margin-top:clamp(20px,2.4vw,28px); padding-top:18px; border-top:1px solid var(--line-color); }
.sub-notes .sub-note{ margin-top:6px; }
.sub-actions--center{ justify-content:center; }
.sub-content > .sub-notes + *,.sub-content > .detail-stack + .sub-notes{ margin-top:clamp(22px,3vw,36px); }

/* 확대 보기 레이어 (단지배치도 · 동호수배치도) : 전체 화면 · 확대/축소 · 스크롤 */
.zoombox{ position:fixed; inset:0; z-index:1200; display:none; flex-direction:column; background:#0a1620; color:#fff; }
.zoombox.is-open{ display:flex; }
.zoombox__bar{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); background:#06101a; }
.zoombox__title{ min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.zoombox__tools{ display:flex; align-items:center; gap:6px; }
.zoombox__scale{ min-width:48px; text-align:center; font-size:12.5px; font-variant-numeric:tabular-nums; }
.zoombox__btn{ width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; font-size:20px; color:#fff; border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.06); }
.zoombox__btn:disabled{ opacity:.35; }
.zoombox__close{ margin-left:8px; font-size:16px; }
.zoombox__scroll{ flex:1 1 auto; overflow:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y pinch-zoom; padding:0 0 env(safe-area-inset-bottom); }
.zoombox__img{ display:block; width:100%; max-width:none; height:auto; margin:0 auto; background:#fff; transition:width .25s ease; }

/* 문서 페이지 : 미리보기 이미지 / PDF 뷰어 + 문서 보기 · 다운로드 */
.docpage{ display:flex; flex-direction:column; gap:clamp(18px,2.4vw,28px); align-items:center; }
.docpage .sub-text{ text-align:center; max-width:100%; }
.docpage__pdf{ width:100%; max-width:1200px; aspect-ratio:3 / 4; max-height:82vh; background:var(--background-alt); border:1px solid var(--line-color); }
.docpage__pdf iframe{ display:block; width:100%; height:100%; border:0; }
.docpage__preview{ width:100%; }
.docpage__actions{ margin-top:0; }
@media (max-width:767px){ .docpage__pdf{ aspect-ratio:3 / 4; max-height:70vh; } }

/* 항공 VR · E-모델하우스 : 안내 + 새 창 버튼 */
.vr-block--link{ text-align:center; padding:clamp(28px,4vw,48px) 20px; border:1px solid var(--line-color); background:var(--background-alt); }
.vr-block__text{ font-size:15.5px; line-height:1.85; color:var(--text-color); word-break:keep-all; }

/* 오시는길 : 약도(원본 폭 이하) + 주소 · 네이버지도 버튼 · 분양문의 */
.dir{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(24px,3vw,56px); align-items:start; }
@media (max-width:900px){ .dir{ grid-template-columns:minmax(0,1fr); } }
.dir__map .detail-content-image-wrap{ border:1px solid var(--line-color); }
.dir__info{ border-top:2px solid var(--primary-color); }
.dir__place{ padding:22px 2px; border-bottom:1px solid var(--line-color); }
.dir__label{ font-family:var(--font-display); font-size:12.5px; letter-spacing:.18em; color:var(--primary-light); }
.dir__addr{ margin-top:8px; font-size:16px; line-height:1.7; color:var(--text-color); word-break:keep-all; }
.dir__btn{ margin-top:12px; }
.dir__tel{ display:inline-block; margin-top:8px; font-family:var(--font-display); font-size:clamp(24px,2.6vw,32px); letter-spacing:.02em; color:var(--primary-color); }

/* 브랜드소개 : 대표 비주얼 → Brand Identity → Core Value → 브랜드 컬러 (이미지 중앙 정렬 · width:100%; height:auto) */
.brand{ display:flex; flex-direction:column; gap:clamp(48px,7vw,96px); }
.brand__visual{ text-align:center; }
.brand__sec{ display:flex; flex-direction:column; gap:clamp(20px,2.6vw,32px); }
.brand__headline{ text-align:center; font-size:clamp(18px,2vw,24px); font-weight:600; letter-spacing:-.02em; line-height:1.6; color:var(--primary-color); word-break:keep-all; }
.brand__body{ margin:0 auto; text-align:center; }
.brand__pair{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(16px,2vw,28px); }
@media (max-width:767px){ .brand__pair{ grid-template-columns:minmax(0,1fr); } }
.brand__values{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(28px,3.4vw,48px) clamp(24px,3vw,40px); }
@media (max-width:767px){ .brand__values{ grid-template-columns:minmax(0,1fr); } }
.brand__value{ min-width:0; }
.brand__value-text{ padding-top:18px; text-align:center; }
.brand__value-en{ font-family:var(--font-display); font-size:clamp(13px,1.2vw,15px); letter-spacing:.14em; color:var(--primary-light); }
.brand__value-ko{ margin-top:6px; font-size:clamp(19px,1.9vw,24px); font-weight:700; letter-spacing:-.03em; color:var(--primary-color); }
.brand__value-desc{ margin-top:10px; font-size:15px; line-height:1.85; color:var(--muted-color); word-break:keep-all; }
.brand__colors{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(14px,2vw,24px); }
@media (max-width:900px){ .brand__colors{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.brand__color{ text-align:center; }
.brand__swatch{ display:block; width:100%; aspect-ratio:4 / 3; border:1px solid var(--line-color); }
.brand__color-name{ margin-top:12px; font-size:16px; font-weight:700; color:var(--primary-color); }
.brand__color-spec{ margin-top:6px; font-size:12.5px; line-height:1.7; color:var(--muted-color); }

/* 탭 이미지 · 평면정보 11종 탭 */
.floor-tabs{ display:block; gap:0; margin-bottom:clamp(24px,3vw,40px); border-top:1px solid var(--line-color); border-bottom:1px solid var(--line-color); }
.floor-tab-row{ display:grid; width:100%; grid-template-columns:repeat(var(--tab-cols,6),minmax(0,1fr)); }
.floor-tab-row--top{ grid-template-columns:repeat(6,minmax(0,1fr)); border-bottom:1px solid var(--line-color); }
.floor-tab-row--bottom{ grid-template-columns:repeat(5,minmax(0,1fr)); }
.floor-tabs .sub-tabbtn{ min-height:52px; margin:0; padding:0 8px; border:0; border-right:1px solid var(--line-color); background:#fff; color:var(--muted-color);
  font-family:var(--font-body); font-size:15px; font-weight:500; white-space:nowrap; word-break:keep-all; text-align:center; }
.floor-tabs .sub-tabbtn:last-child{ border-right:0; }
.floor-tabs .sub-tabbtn:hover,.floor-tabs .sub-tabbtn:focus-visible{ color:var(--color-primary); background:#fff; border-color:var(--line-color); }
.floor-tabs .sub-tabbtn.is-current{ background:var(--color-primary); color:#fff; font-weight:700; border-color:var(--color-primary); }
@media (max-width:767px){
  .floor-tabs{ display:flex; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .floor-tab-row{ display:contents; }
  .floor-tabs .sub-tabbtn{ flex:0 0 auto; min-width:112px; padding:0 16px; font-size:14px; border-right:1px solid var(--line-color); }
  .floor-tabs .sub-tabbtn:last-child{ border-right:0; }
}
@media (max-width:767px){ .sub-tabbtn{ min-height:38px; padding:0 12px; font-size:13px; } }
.floor-plan{ text-align:center; }
.floor-plan__figure .detail-content-image-wrap{ border:1px solid var(--line-color); background:#fff; }

/* 프리미엄 상세 · 하이퍼트 값(텍스트) */
.hypert-visual .detail-content-image-wrap{ border:0; }
.hypert-values{ margin-top:clamp(28px,3.4vw,44px); }
.hypert-value{ padding:clamp(20px,2.4vw,30px); background:var(--background-alt); }
.hypert-footnote{ margin-top:clamp(24px,3vw,36px); }
.loc-figure,.design-figure{ border:0; background:transparent; }

/* [24] 6차 보정 : 자이TV 카드 높이 통일 */
.video-card__title{ min-height:calc(1.55em * 2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }


/* =========================================================================
   [25] 10차 : 프리미엄 모바일 정리 · 페이지별 PC/모바일 이미지 · 평면정보 패널 전환 · 모바일 탭 두 줄
   ========================================================================= */
/* 페이지 상세 이미지 : <picture class="responsive-detail-image"><source media="(max-width:767px)" srcset="-mobile"><img src="-pc"> */
.responsive-detail-image{ display:block; width:100%; }
.responsive-detail-image img{ display:block; width:100%; height:auto; margin:0 auto; }
.hypert-figure .detail-content-image-wrap{ border:0; }
.page-head--latin-only + .loc-figure,.page-head--latin-only + .hypert-figure{ margin-top:clamp(18px,2.4vw,28px); }

/* 프리미엄 제목 : PC 한 줄 · 모바일 두 줄 */
.premium__title-line{ display:inline; }
.premium__title-line + .premium__title-line::before{ content:" "; }

/* 평면정보 : 패널 사전 생성 (is-active 만 표시) · 탭 뷰포트 */
.floorplan-panels{ position:relative; }
.floorplan-panel{ display:none; }
.floorplan-panel.is-active{ display:block; }
.floorplan-tabs-viewport{ width:100%; }

@media (max-width:767px){
  /* 프리미엄 : 화면 가로폭 꽉 채움 · 균일한 어두운 오버레이 · 콘텐츠 세로 배치 · 컨트롤 한 줄 · 퀵메뉴 여백 */
  /* 섹션 = 세로 flex : inner(제목 · 항목, 남는 높이 채움) + controls · 퀵메뉴 여백 — 전체가 100svh 안에 들어감 */
  .premium.home-section{ width:100%; max-width:none; margin:0; min-height:100svh; overflow:hidden; display:flex; flex-direction:column; }
  .premium__bg .media__img{ width:100%; height:100%; object-fit:cover; object-position:center; }
  .premium__overlay{ background:linear-gradient(180deg, rgba(0,30,47,.35) 0%, rgba(0,30,47,.68) 100%); }
  .premium.home-section > .premium__inner{ position:relative; z-index:2; width:100%; min-height:0; flex:1 1 auto; box-sizing:border-box;
    padding:80px 24px 0; display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:flex-start; }
  .premium__head{ padding:0; width:100%; }
  .premium__head + .premium__list{ border-top:0; }
  .premium .premium-title{ font-size:clamp(27px,7.5vw,34px); line-height:1.35; text-align:center; white-space:normal; margin-top:10px; }
  .premium__title-line{ display:block; }
  .premium__title-line + .premium__title-line::before{ content:none; }
  .premium__list{ margin-top:auto; margin-bottom:auto; width:100%; padding:24px 0; }
  .premium__item{ padding:0; align-items:center; text-align:center; }
  .premium__desc span{ width:100%; max-width:340px; margin:24px auto 0; padding-top:0; font-size:15px; line-height:1.7; word-break:keep-all; min-height:calc(1.7em * 3); }
  .premium__controls{ display:grid; grid-template-columns:48px auto 48px; align-items:center; justify-content:center; gap:22px; flex:0 0 auto;
    margin:28px 0 calc(var(--quick-mobile-height) + env(safe-area-inset-bottom) + 46px); padding:0; }   /* 설명 아래 한 줄 · 퀵메뉴 위 여백 */
  .premium__arrow{ width:48px; height:48px; }
  .premium__count{ min-width:64px; text-align:center; }

  /* 평면정보 모바일 : 탭 두 줄(6 + 5) · 탭 영역만 가로 스크롤 · 선택 탭 가운데 */
  .floorplan-tabs-viewport{ width:100%; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .floorplan-tabs-viewport::-webkit-scrollbar{ display:none; }
  .floor-tabs.floorplan-tabs{ display:grid; grid-template-columns:repeat(6,112px); grid-template-rows:repeat(2,52px); grid-auto-flow:row; width:max-content; min-width:100%; overflow:visible;
    border-top:1px solid #d5dde0; border-left:1px solid #d5dde0; border-bottom:0; }
  .floorplan-tabs .floor-tab-row{ display:contents; }
  .floorplan-tabs .floorplan-tab{ width:112px; min-width:112px; height:52px; min-height:52px; margin:0; padding:0; border:0; border-right:1px solid #d5dde0; border-bottom:1px solid #d5dde0; background:#fff; color:#75828b; font-size:14px; white-space:nowrap; flex:none; }
  .floorplan-tabs .floorplan-tab:last-child{ border-right:1px solid #d5dde0; }
  .floorplan-tabs .floorplan-tab.is-current,.floorplan-tabs .floorplan-tab.is-active{ background:#00374f; color:#fff; font-weight:700; }
}


/* =========================================================================
   [26] 11차 · 13차 : 메인 5장 이미지 슬라이드(공식 홈페이지 첫 화면) + 같은 화면 위 SUMMARY 오버레이(한 섹션) · 02 단지설계 카드 흰 띠 제거
   ========================================================================= */
/* 메인 첫 화면 : 문구 없음 · 5장 페이드 슬라이드 (PC slide-0N-pc.jpg · 모바일 slide-0N-mobile.*) — 헤더 · 팝업 · 퀵메뉴는 그 위에 그대로 */
.main-visual{ position:relative; width:100%; height:100vh; overflow:hidden; background:var(--brand-primary); }
@supports (height:100svh){ .main-visual{ height:100svh; } }
.main-slider{ position:absolute; inset:0; z-index:1; overflow:hidden; background:var(--brand-primary); }   /* 이미지가 뜨기 전에도 브랜드 컬러 (흰 화면 없음) */
/* 옆으로 넘어가는 이동 : transform: translate3d (left 사용 안 함) · 활성 · 나가는 2장만 transition, 나머지는 숨김(렌더링 없음) */
.main-slide{ position:absolute; inset:0; z-index:1; visibility:hidden; transform:translate3d(100%,0,0); will-change:transform; backface-visibility:hidden; }
.main-slide.is-active,.main-slide.is-leaving,.main-slide.is-entering{ visibility:visible; }
.main-slide.is-active{ z-index:2; transform:translate3d(0,0,0); transition:transform var(--slide-duration,.75s) cubic-bezier(.22,1,.36,1); }
.main-slide.is-leaving{ z-index:1; transition:transform var(--slide-duration,.75s) cubic-bezier(.22,1,.36,1); }
.main-slide.is-entering{ transition:none; }
/* PC 메인 헤더 가독용 상단 명암 : 조감도 위에 고정된 레이어 1개 (슬라이드가 넘어가도 움직이지 않음 · 클릭 통과)
   검정 0.28 → 0 을 150px 에 걸쳐 8단계로 부드럽게 줄여 끝부분 경계 · 색 끊김이 보이지 않게 함. 써머리 어두운 막(.hero-summary-overlay)은 이 레이어 위에 덮임 */
@media (min-width:1024px){
  .hero-stage > .main-slider::after{ content:""; position:absolute; top:0; left:0; right:0; height:150px; z-index:3; pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,.28) 0%,rgba(0,0,0,.236) 14%,rgba(0,0,0,.186) 30%,rgba(0,0,0,.136) 46%,rgba(0,0,0,.086) 62%,rgba(0,0,0,.042) 78%,rgba(0,0,0,.012) 92%,rgba(0,0,0,0) 100%); }
}
.main-slide picture,.main-slide img{ display:block; width:100%; height:100%; }
.main-slide img{ object-fit:cover; object-position:center; }
.main-slider-pagination{ position:absolute; left:0; right:0; bottom:clamp(22px,4vh,40px); z-index:3; display:flex; justify-content:center; gap:10px; pointer-events:none; }
.main-slider-pagination button{ pointer-events:auto; width:10px; height:10px; padding:0; border:0; border-radius:999px; background:rgba(255,255,255,.45); cursor:pointer;
  transition:width .3s var(--ease), background .3s var(--ease); }
.main-slider-pagination button.is-active{ width:28px; background:#fff; }
.main-slider-pagination button:focus-visible{ outline:2px solid #fff; outline-offset:3px; }
.hero-stage.is-single .main-slider-pagination{ visibility:hidden; pointer-events:none; }   /* 슬라이드가 한 장뿐이면 페이지 표시 숨김 (화살표는 만들지 않음) */
/* 23차 : PC 이전 · 다음 화살표 — 세로 중앙 · 왼쪽은 접힌 팝업 탭(--popup-tab-width), 오른쪽은 퀵메뉴(--quick-width) 바깥으로 28px · 반투명 원형(이미지를 가리지 않음) → 호버 시 흰 배경 */
@media (min-width:1024px){
  /* 마우스 드래그 : 잡는 손 모양 · 끄는 동안 글자/이미지 선택 방지 */
  .hero-stage:not(.is-single):not(.is-locked) .main-slider{ cursor:grab; }
  .hero-stage:not(.is-single):not(.is-locked) .main-slider.is-dragging{ cursor:grabbing; }
}
.main-slider{ -webkit-user-select:none; user-select:none; }
.main-slide img{ -webkit-user-drag:none; }
@media (prefers-reduced-motion:reduce){ .main-slide,.main-slider-pagination button{ transition:none; } }
@media (max-width:767px){
  /* 모바일 : 하단 고정 퀵메뉴(--quick-mobile-height)가 이미지 · 페이지 표시를 가리지 않도록 실제 표시 높이만 사용 */
  .main-visual.home-section{ height:calc(100vh - var(--quick-mobile-height) - env(safe-area-inset-bottom, 0px)); min-height:0; }
  @supports (height:100svh){ .main-visual.home-section{ height:calc(100svh - var(--quick-mobile-height) - env(safe-area-inset-bottom, 0px)); } }
  .main-slide img{ object-position:center; }
  .main-slider-pagination{ bottom:18px; }
}

/* SUMMARY(사업개요) 오버레이 : 첫 섹션(.hero-stage) 안 · 현재 슬라이드 이미지 위 (별도 섹션 · 단색 배경 없음)
   heroState 0 (data-hero-state="slider") → 1 (is-summary · "summary") : 오버레이 0.7s 페이드 → 내용 0.75s 페이드 · 0.2s 지연 · 슬라이더는 그대로 뒤에 보임 */
.hero-stage{ --hero-overlay:rgba(0,25,38,.82); }   /* 써머리 상태에서만 · PC 0.82 (일반 슬라이드 상태에는 적용되지 않음 · 0.6s ease) — 값은 site-data.js summaryScene.overlayColor */
.hero-summary-overlay{ position:absolute; inset:0; z-index:2; background:var(--hero-overlay); opacity:0; visibility:hidden; pointer-events:none; transition:opacity .6s ease, visibility .6s ease, background .6s ease; }
.hero-summary-content{ position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; justify-content:center; color:#fff;
  opacity:0; visibility:hidden; transform:translateY(28px); pointer-events:none; transition:opacity .75s ease .2s, transform .75s ease .2s, visibility .75s ease; }
.hero-summary-content > .home-section__inner{ box-sizing:border-box; min-height:0; height:100%; justify-content:center; }
.hero-stage.is-summary .hero-summary-overlay{ opacity:1; visibility:visible; }
.hero-stage.is-summary .hero-summary-content{ opacity:1; visibility:visible; transform:none; pointer-events:auto; }
.hero-stage .main-slider-pagination{ transition:opacity .4s ease; }
.hero-stage.is-summary .main-slider-pagination{ opacity:0; pointer-events:none; }   /* 써머리 상태 : 페이지 표시 잠금 */
.main-slider.no-transition .main-slide{ transition:none !important; }              /* 진행 중 페이드를 즉시 확정할 때 */
@media (prefers-reduced-motion:reduce){ .hero-summary-overlay,.hero-summary-content{ transition:none; } }
@media (max-width:767px){
  /* 모바일 메인 : 고정 헤더 높이만큼 흰 영역(이미지와 겹치지 않음) → 공식 모바일 이미지 전체(contain · 자르기 · 확대 없음) → 흰 슬로건 → 작은 페이지 표시 · 전체 최소 높이 = 화면 − 퀵메뉴 */
  .hero-stage.main-visual.home-section{ height:auto; min-height:calc(100svh - var(--quick-mobile-height) - env(safe-area-inset-bottom, 0px)); padding-top:var(--header-height); background:#fff; display:flex; flex-direction:column; }
  .hero-stage .main-slider{ position:relative; inset:auto; z-index:1; display:grid; width:100%; flex:0 0 auto; overflow:hidden; background:var(--brand-primary); }   /* 이미지가 뜨기 전 브랜드 컬러 */
  .hero-stage .main-slide{ position:relative; inset:auto; grid-area:1 / 1; width:100%; height:auto; }
  .hero-stage .main-slide picture{ height:auto; aspect-ratio:640 / 645; background:var(--brand-primary); }   /* 로딩 전에도 이미지 높이만큼 자리 확보 (공식 모바일 640×645) */
  .hero-stage .main-slide img{ width:100%; height:auto; display:block; object-fit:contain; object-position:center top; }
  .hero-stage .mobile-hero-slogan{ display:block; flex:1 0 auto; padding:30px 24px 8px; color:var(--brand-primary); text-align:center; background:#fff; }
  .hero-stage .mobile-hero-slogan__latin{ margin:0; font-family:var(--font-display); font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:rgba(0,47,71,.72); }
  .hero-stage .mobile-hero-slogan__text{ margin:12px 0 0; font-size:clamp(20px,5.6vw,24px); font-weight:600; line-height:1.4; letter-spacing:-.02em; word-break:keep-all; }
  .hero-stage .main-slider-pagination{ position:relative; left:auto; right:auto; bottom:auto; z-index:1; padding:0 24px 22px; background:#fff; gap:8px; }
  .hero-stage .main-slider-pagination button{ width:7px; height:7px; background:rgba(0,47,71,.25); }
  .hero-stage .main-slider-pagination button.is-active{ width:20px; background:var(--brand-primary); }
  .hero-stage .mobile-hero-slogan{ transition:opacity .6s ease; }
  .hero-stage.is-summary .mobile-hero-slogan{ opacity:0; }   /* 써머리 상태 : 슬로건 글자가 오버레이 아래로 비쳐 써머리 문구와 겹치지 않도록 숨김 (흰 영역은 오버레이로 어두워짐) */
  /* 써머리 오버레이 : 모바일은 조금 더 진하게 (summaryScene.overlayColorMobile) */
  .hero-summary-overlay{ background:var(--hero-overlay-mobile, var(--hero-overlay)); }
  /* 모바일 써머리 : 헤더 아래부터 · 표는 세로형 한 열 · 섹션 높이가 퀵메뉴를 뺀 값이라 퀵메뉴와 겹치지 않음 · 내용이 길면 안에서 스크롤 */
  .hero-summary-content{ justify-content:flex-start; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .hero-summary-content > .home-section__inner{ height:auto; min-height:100%; width:100%; padding:calc(var(--header-height) + 16px) 22px 22px; justify-content:center; }
  .hero-summary-content .summary__layout{ grid-template-columns:minmax(0,1fr); column-gap:0; row-gap:18px; }
  .hero-summary-content .summary__latin{ font-size:clamp(34px,10vw,44px); }
  .hero-summary-content .summary__title{ margin-top:8px; font-size:15px; }
  .hero-summary-content .summary__desc{ font-size:13px; }
  .hero-summary-content .summary__rows{ grid-template-columns:minmax(0,1fr); gap:12px; }
  .hero-summary-content .summary__label{ font-size:11px; }
  .hero-summary-content .summary__hr{ margin:6px 0; }
  .hero-summary-content .summary__value{ font-size:14px; line-height:1.5; }
  .hero-summary-content .summary-notice{ margin-top:14px; }
  .hero-summary-content .summary__note{ margin:0; font-size:11.5px; line-height:1.7; }
}

/* 메인 3카드 이미지 : 세 박스(입지환경 · 단지설계 · 하이퍼트) 모두 같은 크기의 각진 사각형 — 둥근 모서리 · clip-path · mask 없음 (PC · 모바일 동일)
   02 단지설계는 공식 원본에서 흰 여백 · 둥근 모서리가 없는 영역을 다시 잘라낸 파일(complex-design-card.png · 4:3)이라 확대 없이 cover 로 영역을 가득 채움 */
.location-card-image,.complex-design-image-wrap,.hypert-card-image,
.location-card-image img,.complex-design-image-wrap img,.hypert-card-image img{ border-radius:0 !important; clip-path:none !important; -webkit-mask-image:none !important; mask-image:none !important; }
.complex-design-image-wrap{ width:100%; overflow:hidden; }
.complex-design-image-wrap img{ display:block; width:100%; height:100%; margin:0; max-width:none; object-fit:cover; object-position:center; }


/* =========================================================================
   [27] 12차 : 메인 모바일 프리미엄 — 라운드 아치 카드 덱 · 진입 시퀀스 · 자동 전환 (767px 이하 · 메인 #premium.mobile-premium-section 만 · PC · 소메뉴 무변경)
   참고 : sujain-miryang.co.kr 모바일 프리미엄 — 제목 1.2s(0.6s 뒤) 등장 · 항목 텍스트 opacity + translateX 1.2s(0.2s 뒤) · 배경 1.2s 크로스페이드 + 2.5s 줌 정착 · 자동 5초
   ========================================================================= */
.mobile-premium-label,.mobile-premium-deck,.mobile-hero-slogan{ display:none; }   /* PC · 태블릿 : 사용하지 않음 (PC 무변경) */
@media (max-width:767px){
  /* 폰트 : 참고 사이트 모바일 프리미엄 Computed 값 — 본문 "Noto Sans KR" 400 · 자간 -0.5px, 라틴 표기(PREMIUM 6 · 번호)는 Trajan(상용) → 무료 대체 Cinzel 600. 이 섹션 안에서만 적용 (헤더 · 푸터 · 타입안내 · 소메뉴 무관) */
  body[data-page="index"] .premium.mobile-premium-section,
  body[data-page="index"] .premium.mobile-premium-section *{ font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  body[data-page="index"] .premium.mobile-premium-section .mobile-premium-label,
  body[data-page="index"] .premium.mobile-premium-section .premium__num,
  body[data-page="index"] .premium.mobile-premium-section .premium__count{ font-family:"Cinzel","Cormorant Garamond","Times New Roman",Times,serif; }
  body[data-page="index"] .premium.mobile-premium-section .premium-title,
  body[data-page="index"] .premium.mobile-premium-section .premium-title *{ font-family:var(--font-body); }   /* 섹션 대표 제목은 다른 메인 섹션 제목과 같은 글꼴(Pretendard) · 굵기(--fw-section-title) */

  /* 배경 : 항목 이미지 크로스페이드(1.2s) + 줌 정착(1.12 → 1 · 2.5s) · 짙은 그라디언트 (카드 · 글자가 주인공) */
  .premium.mobile-premium-section{ background:#001E2F; }
  .premium.mobile-premium-section .premium__bg{ transition:opacity 1.2s ease; transform:none; }
  .premium.mobile-premium-section .premium__bg .media__img{ transform:scale(1.12); transition:transform 2.5s ease; }
  .premium.mobile-premium-section .premium__bg.is-active .media__img{ transform:scale(1); }
  .premium.mobile-premium-section .premium__overlay{ background:linear-gradient(180deg, rgba(0,20,32,.62) 0%, rgba(0,20,32,.84) 50%, rgba(0,20,32,.92) 100%); }

  /* 구성 : 섹션 가로 100% · 좌우 22px · PREMIUM 5 → 제목 → 카드 덱 → 번호 · 제목 · 설명 → 컨트롤(퀵메뉴 위 여백) */
  .premium.mobile-premium-section > .premium__inner{ padding:calc(var(--header-height) + 18px) 22px 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; text-align:center; }
  .premium.mobile-premium-section .premium__head{ order:0; width:100%; padding:0; }
  .premium.mobile-premium-section .section__eyebrow{ display:none; }
  .premium.mobile-premium-section .mobile-premium-label{ display:block; margin:0; font-size:clamp(30px,8.6vw,38px); font-weight:600; letter-spacing:.02em; line-height:1; color:#fff; text-transform:uppercase;
    opacity:0; transform:translateY(26px); transition:opacity .9s ease .1s, transform 1s cubic-bezier(.22,1,.36,1) .1s; }
  .premium.mobile-premium-section .premium-title{ margin:12px 0 0; font-size:clamp(15px,4.3vw,17px); font-weight:var(--fw-section-title); letter-spacing:-.5px; line-height:1.45; color:rgba(255,255,255,.86); white-space:normal;
    opacity:0; transform:translateY(22px); transition:opacity .9s ease .35s, transform 1s cubic-bezier(.22,1,.36,1) .35s; }
  .premium.mobile-premium-section .premium__title-line{ display:inline; }
  .premium.mobile-premium-section .premium__title-line + .premium__title-line::before{ content:" "; }
  .premium.mobile-premium-section.is-visible .mobile-premium-label,
  .premium.mobile-premium-section.is-visible .premium-title{ opacity:1; transform:none; }

  /* 카드 덱 : 활성 카드 가운데 · 맨 앞(가장 큼), 좌우 카드는 뒤에서 일부만 · 위 아치(160px) 아래 살짝 둥근(24px) · clip-path 없음 */
  .premium.mobile-premium-section .mobile-premium-deck{ --card-w:min(calc(0.52 * (100vw - 44px)), 190px); order:1; display:block; position:relative; width:100%; height:calc(var(--card-w) * 4 / 3 + 34px); margin:clamp(14px,2.4svh,24px) 0 0; }
  .premium.mobile-premium-section .mobile-premium-card{
    position:absolute; left:calc(50% - var(--card-w) / 2); top:0; width:var(--card-w); height:calc(var(--card-w) * 4 / 3); aspect-ratio:auto;
    overflow:hidden; border-radius:160px 160px 24px 24px; border:1px solid rgba(255,255,255,.14); box-shadow:0 18px 40px rgba(0,8,16,.45); background:#0a2536;
    opacity:0; transform:translateY(50px) scale(.88); transform-origin:50% 100%;
    transition:opacity .8s ease, transform 1.1s cubic-bezier(.22,1,.36,1); will-change:transform, opacity; }
  .premium.mobile-premium-section .mobile-premium-card picture,
  .premium.mobile-premium-section .mobile-premium-card .media__img{ display:block; width:100%; height:100%; }
  .premium.mobile-premium-section .mobile-premium-card .media__img{ object-fit:cover; object-position:center; transform:none; }
  .premium.mobile-premium-section.is-visible .mobile-premium-card{ opacity:var(--op,1); transform:translate(var(--tx,0%), var(--ty,0px)) rotate(var(--rot,0deg)) scale(var(--sc,1)); }
  .premium.mobile-premium-section.is-visible .mobile-premium-card:nth-child(1){ transition-delay:.5s; }   /* 제목 뒤 순차 펼침 (0.1s 간격) */
  .premium.mobile-premium-section.is-visible .mobile-premium-card:nth-child(2){ transition-delay:.6s; }
  .premium.mobile-premium-section.is-visible .mobile-premium-card:nth-child(3){ transition-delay:.7s; }
  .premium.mobile-premium-section.is-visible .mobile-premium-card:nth-child(4){ transition-delay:.8s; }
  .premium.mobile-premium-section.is-visible .mobile-premium-card:nth-child(5){ transition-delay:.9s; }
  .premium.mobile-premium-section.is-settled .mobile-premium-card,
  .premium.mobile-premium-section.is-settled .mobile-premium-card:nth-child(n){ transition:opacity .55s ease, transform .9s cubic-bezier(.22,1,.36,1), filter .55s ease; transition-delay:0s; }   /* 진입 뒤 전환 : 지연 없이 함께 이동 (nth-child 지연 규칙보다 우선) */

  .premium.mobile-premium-section .mobile-premium-card{ will-change:transform, opacity, filter; }

  .premium.mobile-premium-section.is-visible .mobile-premium-card.is-active{ opacity:1; }

  /* 번호 · 제목 · 설명 : 5개 항목을 같은 자리에 겹쳐 두고 활성 항목만 표시 (참고 사이트 : 번호 페이드 · 제목 · 설명 오른쪽에서 1.2s(0.2s 뒤)) */
  .premium.mobile-premium-section .premium__list{ order:2; display:grid; width:100%; margin:clamp(14px,2.2svh,22px) 0 auto; padding:0; flex:0 0 auto; border-top:0; }
  .premium.mobile-premium-section .premium__item{ grid-area:1 / 1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; width:100%; padding:0; color:#fff; background:transparent; border:0;

  .premium.mobile-premium-section .premium__desc{ display:block; grid-template-rows:none; opacity:0; transform:translateX(40px); transition:opacity .8s ease, transform .8s ease; }
  .premium.mobile-premium-section .premium__desc span{ display:block; width:100%; max-width:300px; margin:12px auto 0; padding:0; min-height:calc(1.6em * 3); font-size:13.5px; font-weight:400; letter-spacing:-.5px; line-height:1.6; color:rgba(255,255,255,.82); word-break:keep-all; overflow-wrap:anywhere; }
  .premium.mobile-premium-section .premium__more{ display:none; }
  .premium.mobile-premium-section.is-visible .premium__item.is-active .premium__num{ opacity:1; transition:opacity 1.2s ease .2s; }
  .premium.mobile-premium-section.is-visible .premium__item.is-active .premium__title,
  .premium.mobile-premium-section.is-visible .premium__item.is-active .premium__desc{ opacity:1; transform:none; transition:opacity 1.2s ease .2s, transform 1.2s ease .2s; }
  /* 첫 진입 : 카드가 펼쳐진 뒤 번호 → 제목 → 설명 */
  .premium.mobile-premium-section.is-visible:not(.is-settled) .premium__item.is-active .premium__num{ transition-delay:1.15s; }

  /* 컨트롤 : 이전 · 01 / 05 · 다음 (한 줄) — 하단 고정 퀵메뉴 위 여백 확보 */
  .premium.mobile-premium-section .premium__controls{ display:grid; grid-template-columns:48px auto 48px; align-items:center; justify-content:center; gap:22px; flex:0 0 auto;

/* =========================================================================
   [29] 19차 : PC 프리미엄 활성 글자 확대 · 헤더 전화 연결(아이콘) · 푸터 정돈 · 모바일 써머리 순차 등장
   ------------------------------------------------------------------------
   · PC 프리미엄 : 마우스를 올린(활성) 항목의 번호 14~15px · 제목 30~32px · 설명 17~18px(행간 1.7) — 비활성 항목은 기존 크기 그대로
     글자 크기는 0.4s ease 로 부드럽게 커지고, clamp() 로 화면 폭이 좁아지면 함께 줄어 옆 항목을 침범하지 않습니다.
     배경 · 5분할 구조 · 호버 이미지 전환은 변경 없음.
   · 헤더 대표번호 : SVG 라인 전화 아이콘 + 번호 한 그룹(tel: 링크) · 아이콘 18px · 간격 8px · 테두리/배경 없음 · 색상은 헤더 색(투명 헤더 흰색 · 흰 헤더 #002F47)을 그대로 상속 · 0.3s ease
     모바일(1023px 이하) : 번호 숨김 · 아이콘 22px 만 · 로고 → 여유 공간 → 전화 아이콘 → 햄버거 · 44×44 터치 영역 · 아이콘과 햄버거 사이 약 20px
   · 푸터 : PC 안내 문구 14.5px/1.6 · 간격 15px · 상담 문의 22px · 대표번호 52~56px(700) · 제목-번호 28px · 상하 여백 약 12% 축소
            모바일 안내 문구 11.5px/1.55 · 간격 11px · 상담 문의 17.5px · 대표번호 34~38px 한 줄 · 하단 퀵메뉴 여백 유지
   · 모바일 써머리 : [data-reveal] 요소가 opacity 0 · translateY(-24px) → .is-in 에서 0.8s cubic-bezier(.22,1,.36,1) · 순번 × 0.13s 지연으로 표시
                     (배경 #002F47 별도 섹션 · 배경 이미지 없음 · 높이는 애니메이션 전에도 동일 · reduced-motion 은 즉시 표시)
   ========================================================================= */
@media (min-width:768px){

  .premium__item.is-active .premium__title{ font-size:clamp(22px,2.15vw,32px); line-height:1.4; }   /* 1440px → 31px · 1920px → 32px · 1024px → 22px */

  .premium__item .premium__title,.premium__item .premium__desc span{ max-width:100%; min-width:0; }   /* 글자가 커져도 항목 폭 안에서 줄바꿈 */

/* =========================================================================
   [30] 20차 : 모바일 슬로건 세로 중앙 · 모바일 푸터 번호 축소 · PC 푸터 문구 조밀 · PC 프리미엄 호버 리플로우 제거 · PC 헤더 세로 중앙 통일
   ------------------------------------------------------------------------
   · 모바일 메인 : 조감도 아래 흰 영역 = 슬로건(flex:1 · 세로 중앙 정렬) + 인디케이터(하단 고정 · 겹침 없음) — 고정 margin 없이 flex 로 어떤 화면 높이에서도 중앙
   · 모바일 푸터 대표번호 30~32px · 600 · 행간 1.1 · 한 줄 (PC 값은 19차 그대로)
   · PC 푸터 안내 문구 14px · 행간 1.45 · 문단 간격 9px · 문구-상담문의 간격 18px (모바일 미적용 · 색 · 내용 불변)
   · PC 프리미엄 : font-size · line-height · width · letter-spacing 전환 없음(즉시) · 설명 폭 = 항목 폭으로 고정 · 최소 높이 2줄 · keep-all · text-wrap balance
                  전환은 색(0.5s) · 설명 펼침 높이/투명도(0.35s) 만 → 빠르게 연속 호버해도 줄 수가 뒤늦게 바뀌거나 흔들리지 않음 (JS 활성 클래스는 mouseenter 즉시 · 지연 타이머 없음)
   · PC 헤더 : 로고 · 메뉴 · 전화 그룹 세로 중심 통일 (flex align-items:center + 메뉴 링크 대칭 패딩 + line-height 1 · 개별 top/margin/translate 보정 없음) · 높이 92px · 좌우 위치 · 메뉴 간격 불변 · 투명/흰 헤더 동일 · 모바일 무영향

   ------------------------------------------------------------------------

     → 전화 아이콘(같은 SVG · currentColor) · 대표번호 · 메뉴 글자가 배경과 동시에 즉시 바뀌어 깜빡임 없음 (호버 전환 효과는 그대로)
   · PC 팝업이 펼쳐진 동안 .wbnote-dim(z 899 : 헤더 300 · 퀵메뉴 270 · TOP 250 위 · 팝업 900 아래)이 전체 화면을 덮고 body.is-locked 로 스크롤 잠금
     모바일은 기존처럼 .wbnote 자체가 배경을 덮으므로 .wbnote-dim 은 표시하지 않음

.header.is-switching,.header.is-switching *{ transition:none !important; }

.wbnote-dim.is-on{ opacity:1; visibility:visible; pointer-events:auto; transition:opacity .45s ease, visibility 0s; }   /* 팝업과 함께 자연스럽게 페이드인 */
@media (max-width:767px){ .wbnote-dim{ display:none; } }

/* =========================================================================
   복제용 편집 가이드 (다른 아파트 현장으로 옮길 때 이 순서대로 수정하세요)
   ------------------------------------------------------------------------
   [파일 구성]
     index.html              메인페이지
     subpage.html            모든 서브메뉴가 사용하는 공통 페이지
     assets/css/style.css    전체 디자인 (컬러·폰트 기본값)
     assets/js/site-data.js  모든 데이터 (이 파일) ← 대부분 여기만 고치면 됩니다
     assets/js/common.js     헤더 · 메가메뉴 · 팝업 · 퀵메뉴 · 푸터 · 폼 · 스크롤 효과
     assets/js/main.js       메인페이지 섹션
     assets/js/subpage.js    서브페이지 (subpage.html?page=페이지ID)
     assets/fonts/           Pretendard 폰트 (Regular/Medium/SemiBold/Bold)
     assets/images/          모든 이미지

   1) 현장명 · 로고 · 전화번호 → site
      로고는 이미지 한 장만 사용합니다. (헤더에 한글·영문 텍스트를 따로 출력하지 않음)
      logo.imageLight  : 어두운 헤더(조감도 위)용 화이트 로고
      logo.imageDark   : 흰색 헤더용 네이비 로고
      logo.width       : 로고 가로 크기(px) · logo.alt : 대체 텍스트
      ※ 로고 이미지 파일이 아직 없을 때만 fallbackText 가 임시로 표시됩니다.

   2) 컬러 · 폰트 · 글자 크기/굵기/자간/행간 → theme
      컬러는 theme.colors 의 --color-* 토큰 하나만 바꾸면
      헤더 · 메뉴 · 버튼 · 링크 · 팝업 탭 · 퀵메뉴 · 방문예약 · 푸터까지 모두 바뀝니다.
      (CSS 안에는 색상값을 직접 쓰지 않고 이 토큰만 참조합니다)
      theme.colors / theme.fonts / theme.typography / theme.layout
      (CSS 를 고치지 않아도 CSS 변수로 자동 적용됩니다.)
      한글 폰트 파일을 바꾸려면 assets/fonts 에 파일을 넣고
      style.css 최상단 @font-face 의 url 만 수정하세요.

   3) 헤더 메뉴 · 소메뉴 → menu
      메가메뉴는 메인 메뉴 바로 아래에 소메뉴 열이 자동 정렬됩니다.
      링크 규칙은 pageUrl (기본 subpage.html?page=페이지ID)
      메인페이지 섹션으로 바로 보내고 싶은 메뉴만 sectionMap 에 추가하세요.

   4) 메인 첫 화면 → mainSlider (5장 이미지 슬라이드 · 문구 없음)
      · 이미지 : slides[].src (PC) · slides[].mobileSrc (모바일) · alt
      · 동작   : interval(자동 전환 간격) · duration(페이드 시간)
      · 파일   : assets/images/main-slider/slide-01~05-pc.jpg (PC 1920×1080) · slide-01~05-mobile.jpg (공식 모바일 전용 640×645)

   5) SUMMARY → summaryScene(오버레이 색 · 제목 · 유의 문구) — 첫 화면 슬라이드 위 오버레이로 표시 (내용은 siteContent.businessOverview)
      rows 를 추가·삭제하면 정보 그리드가 자동으로 3열/2열/1열로 정렬됩니다.

   6) PREMIUM → premiumSection + premium 배열
      배열 개수만큼 화면이 자동 분할(3개=3분할, 6개=6분할)됩니다.
      제목 영역을 숨기려면 premiumSection.showHeading = false

   7) 입지환경 → environmentSection + environment 배열
      세 카드의 기준선은 항상 동일하며, 이미지 규격은
      environmentSection.imageAspectRatio / imageHeight / imageGap / cardGap 로
      한 번에 변경합니다. 개별 이미지는 image.position(초점), image.objectFit 로 조정합니다.

   8) 타입안내 → unitSection + units 배열
      unitSection.title 이 메인 TYPE 섹션 제목입니다. (기본 "타입안내")
      한 화면에 보이는 개수는 unitSection.perView (기본 3, 태블릿 2, 모바일 1)
      버튼(links.floorPlan / interior / modelHouse)이 비면 자동으로 숨겨지고,
      버튼 개수가 달라도 이미지 상·하단 기준선은 자동으로 맞춰집니다.

   9) 방문예약 → reserve (섹션 id 는 #visit-reservation)
      fields 배열 : text / phone(010-입력-입력) / date / time / select / textarea
      visitTimes 배열 : 방문 시간 선택 목록
      신청 내용은 통합웹빌더 서버로 전송되어 관리자(통합웹빌더관리자.html) › 방문예약 관리에 저장됩니다.
      서버 주소 · 사이트 식별값은 assets/js/cms-config.js 에서 설정합니다. (안내 문구를 바꾸려면 reserve.messages { offline, network, fail, busy })

  10) 좌측 팝업 → popupOptions + popups
      팝업은 이미지 전용입니다. (제목 · 설명 · 버튼 · 하단 문구 없음)
      popupBanners[] 한 배열의 src · alt · href 만 넣으면 PC 3열과 모바일 슬라이드에 동시에 반영됩니다.
      이미지 비율은 popupOptions.aspectRatio(기본 3 / 4), 높이는 desktopHeight 로 조절합니다.
      닫기는 패널 우측 상단 ✕ 또는 세로형 POPUP 탭으로 하며,
      한 번 닫으면 같은 탭에서 다른 페이지로 이동해도 자동으로 다시 열리지 않습니다.
      배너는 데스크톱에서 가로 한 줄로 모두 펼쳐집니다. (슬라이드·도트 없음)
      columns(기본 3) · aspectRatio(기본 3 / 2) · gap · objectFit 으로 크기를 맞추고,
      너비는 widthMode(full·medium·custom) 와 fullWidth / mediumWidth / customWidth,
      최대 높이는 desktopMaxHeight(기본 68vh) 로 조절합니다.
      배너별로 aspectRatio · objectFit · image.position(초점)을 따로 지정할 수 있습니다.
      모바일에서는 한 장씩 가로 스와이프로 표시됩니다.
      팝업 너비는 우측 퀵메뉴와 quickGap(기본 24px) 이상 떨어지도록 자동 계산되며,
      패널 우측 상단 ✕ 버튼 · 하단 닫기 · 세로형 POPUP 탭 어느 것으로도 닫을 수 있습니다.
      닫힘 상태는 sessionStorage(일반 닫기) · localStorage(오늘 하루 보지 않기)에 저장되어
      메인과 모든 소메뉴 페이지에서 공통으로 유지됩니다.
      닫기 상태 : 일반 닫기는 sessionStorage, 오늘 하루 보지 않기는 localStorage 에
      저장되어 서브페이지로 이동해도 다시 자동으로 열리지 않습니다.

  11) 우측 퀵메뉴 → quickMenu + quickMenuTitle + settings.quickMobile
      icon : home / unit / mail / phone / map / calendar / premium / top
      type:"section" → 같은 페이지 섹션 이동 / type:"page" + page:"페이지ID" → 메뉴와 같은 소메뉴 페이지 이동 / type:"link" + url → 임의 주소

  12) 서브페이지 → pages
      layoutType 으로 페이지마다 본문 구조가 달라집니다.
        overview · featureGrid · locationMap · vr · directions · brandStory ·
        premium · sitePlan · unitMap · imageStory · tabsGallery · gallery ·
        system · floorPlan · table · document · schedule · news · video · form · text
      (이전·다음 페이지 이동 영역은 사용하지 않습니다.)
      큰 한글 제목 위의 작은 영문(PROJECT · LOCATION 등)은 표시하지 않습니다.
      사업개요(overview)는 왼쪽 이미지 + 오른쪽 정보표 2열이며,
      layoutRatio(예 "1.2fr 1fr") · image.ratio · details[] · notice 로 편집합니다.
      모든 페이지의 sections 배열에 아래 유형을 자유롭게 추가할 수 있습니다.
        { type:"image",     enabled:true, image, alt, ratio, objectFit, objectPosition, maxWidth }
        { type:"imageText", enabled:true, layout:"image-left"|"image-right", title, description, image, ratio }
        { type:"gallery",   enabled:true, columns:3, images:[{ src, alt }] }
      enabled:false 로 두면 여백 없이 완전히 사라집니다.
      · iframe : pages[].iframe 에 주소 입력 (항공 VR · e모델하우스 · 영상)
      · document : pages[].documents 에 { label, meta, url }
      · 숫자 요약 : pages[].stats 에 { value, unit, label }
      · 하단 주의문구 : pages[].note
      · 넓은 화면이 필요하면 pages[].wide = true
      등록되지 않은 page 값으로 접근하면 같은 디자인의 안내 화면이 표시됩니다.

  13) 푸터 → footer
      notices 배열(※ 유의사항) · phoneLabel · phoneDisplay · phoneLink 로 수정하며
      모든 페이지 하단에 동일하게 출력됩니다.

  14) 섹션 순서 · 노출 → sections (배열 순서대로 표시, enabled:false 면 제거)
      스크롤 효과 → animation (enabled / replay / duration / stagger / threshold / parallax)

  15) [이미지] 모든 이미지는 media 한 가지 형식으로 관리하며, 화면에는 항상 실제 <img> 가 출력됩니다.
      media: {
        enabled: true,
        src: "./assets/images/a.jpg" | "/images/a.jpg" | "https://example.com/a.jpg",
        mobileSrc: "",            // 모바일(767px 이하) 전용 (없으면 src 사용) → <picture><source> 로 출력
        alt: "이미지 설명",
        href: "",                 // 클릭 시 이동 주소 (비우면 링크 없음) → 있으면 <a class="editable-image">
        target: "_self",          // _blank 이면 rel="noopener noreferrer" 자동
        ratio: "4 / 3",           // 16 / 9 · 21 / 9 · 4 / 3 · 3 / 2 · 3 / 4 · 1 / 1 · 4 / 5
        objectFit: "cover",       // cover | contain
        objectPosition: "center center" // 잘릴 때 초점만 조절
      }
      · src 가 비어 있거나 로딩에 실패하면 글자 없는 (없음) 가 같은 크기로 표시됩니다. (영역이 사라지지 않음)
      · media 를 아예 지우면 placeholder 로 자동 생성되고, enabled:false 로 두면 영역 + 여백이 함께 제거됩니다.
      · 생성 DOM : <a|div class="editable-image"><picture><source media="(max-width:767px)"><img src alt></picture></a|div>
      · 적용 위치 : (메인 슬라이드는 mainSlider.slides[] 의 src / mobileSrc / alt 를 그대로 출력) ·
        프리미엄 배경(premium[].media) · 입지환경 3종(environment[].media) · 타입 배경/카드(unitSection.media, units[].media) ·
        팝업 배너(popupBanners[].src, PC · 모바일 공용) ·
        모든 소메뉴의 대표 이미지(pages[ID].media) 와 항목별 이미지(items[].media · tabs[].media · documents[].media 등)
      · 새 페이지를 pages 에 추가하면 media 를 넣지 않아도 대표 이미지 영역(placeholder)이 자동 생성됩니다.

  16) [메인 원스크롤] 데스크톱에서 휠 한 번에 한 섹션씩 이동합니다.
      CSS 스크롤 스냅은 사용하지 않고 JavaScript 한 곳에서만 이동을 처리합니다.
      fullPageScroll.duration(기본 1800ms) · lockDuration · wheelThreshold ·
      revealDelay · revealDuration · staggerDelay 로 속도를 조절합니다.
      순서는 sections 배열을 따르며, 각 섹션은 화면 한 장을 채웁니다.
      입력창 · 셀렉트 · 팝업 · 메가메뉴 위에서는 동작하지 않고,
      섹션에 도착한 뒤에 제목 → 설명 → 이미지 순으로 나타납니다.
      (태블릿 · 모바일 · prefers-reduced-motion 환경에서는 일반 스크롤)
   ========================================================================= */

<script>window.__CMS_INLINE = {
"assets/js/common.js": function () {
/* =========================================================================
   common.js : 모든 페이지가 공통으로 사용하는 기능
   ------------------------------------------------------------------------
   · 테마(컬러·폰트) 적용        · 공통 헤더 / 메가메뉴 / 모바일 메뉴
   · 좌측 가로형 팝업            · 우측 퀵메뉴
   · 공통 푸터 / 이미지 모달 / 상단 이동 버튼
   · 헤더 컬러 자동 전환(overlay ↔ solid)
   · 스크롤 등장 애니메이션      · 방문예약 폼 생성기
   index.html 과 subpage.html 모두 이 파일을 불러옵니다.
   ========================================================================= */
window.SITE = (function () {
  'use strict';

  const $  = (s, c) => (c || document).querySelector(s);
  const $$ = (s, c) => Array.prototype.slice.call((c || document).querySelectorAll(s));
  const prefersReduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const mqMobile = window.matchMedia ? window.matchMedia('(max-width:767px)')  : { matches: false };
  const mqTablet = window.matchMedia ? window.matchMedia('(max-width:1023px)') : { matches: false };
  const isOn   = (o) => !!o && o.enabled !== false;
  const onlyOn = (a) => (a || []).filter(isOn);
  const clamp  = (v, a, b) => Math.min(b, Math.max(a, v));
  const esc    = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const ANIM = SITE_DATA.animation || {};

  /* 현재 페이지 정보 : index.html 인지, 서브페이지라면 어떤 page 인지 */
  const params = new URLSearchParams(window.location.search);
  const hashPage = (window.location.hash.match(/^#page=([\w-]+)/) || [])[1] || '';
  /* 단일 파일(전체 통합 HTML)로 열었을 때 true */
  const singleFile = !!window.SINGLE_FILE;
  const HOME = singleFile ? '#' : 'index.html';
  const bodyPage = (document.body && document.body.getAttribute('data-page')) ||
                   (hashPage ? 'subpage' : (/subpage\.html/i.test(window.location.pathname) ? 'subpage' : 'index'));
  const isIndex = bodyPage === 'index';
  /* 대표번호 단일 소스 (site.tel) → tel: 링크 · 접근성 문구 (PC 헤더 · 모바일 아이콘 · 모바일 메뉴 · 푸터 · 소메뉴 CTA 공통 · SITE.telHref / SITE.telAria 로 공개) */
  const SITE_TEL = (SITE_DATA.site && SITE_DATA.site.tel) || '';
  const TEL_HREF = 'tel:' + SITE_TEL.replace(/[^0-9+]/g, '');
  const TEL_ARIA = '대표번호 ' + SITE_TEL + '으로 전화하기';
  /* 문자 문의 번호(site.smsTel · 없으면 대표번호) · 카카오톡 상담 링크(site.kakaoUrl) — 퀵메뉴 · 버튼의 "문자 보내기 / 카카오톡 상담" 이 참조 */
  const SITE_SMS = (SITE_DATA.site && SITE_DATA.site.smsTel) || SITE_TEL;
  const SMS_HREF = 'sms:' + String(SITE_SMS).replace(/[^0-9+]/g, '');
  const KAKAO_URL = (SITE_DATA.site && SITE_DATA.site.kakaoUrl) || '';
  /* 문구 안의 사이트 공통값 토큰 : {대표번호} {사이트명} {현장명} {이메일} {상담시간} {주소} — 페이지 본문에 번호를 직접 적지 않고 토큰으로 두면 사이트 설정의 값이 표시됩니다 (숫자를 찾아 바꾸는 방식이 아님) */
  function siteTokens() { const s = SITE_DATA.site || {}; return { '대표번호': SITE_TEL, '사이트명': s.name || '', '현장명': s.fieldName || '', '이메일': s.email || '', '상담시간': s.consultHours || '', '주소': s.address || '' }; }
  function fillTokens(text) { const map = siteTokens(); return String(text == null ? '' : text).replace(/\{(대표번호|사이트명|현장명|이메일|상담시간|주소)\}/g, function (m, k) { return map[k] != null ? map[k] : m; }); }
  /* 화면에 그려진 뒤 호출 : ① 글자 속 토큰 채우기 ② "사이트 대표번호 사용" 링크(tel: 만 있는 링크 · tel:site)에 실제 번호 연결 ③ sms:site · #kakao 연결 */
  function bindSiteValues(root) {
    root = root || document.body; if (!root) return;
    try {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: function (n) { return /\{(대표번호|사이트명|현장명|이메일|상담시간|주소)\}/.test(n.nodeValue) && !(n.parentNode && n.parentNode.closest && n.parentNode.closest('script,style,textarea,[contenteditable="true"]')) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP; } });
      const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function (n) { n.nodeValue = fillTokens(n.nodeValue); });
    } catch (err) {}
    $$('a[href]', root).forEach(function (a) {
      const h = a.getAttribute('href') || '';
      if (/^tel:(site|\{대표번호\})?$/i.test(h)) { if (SITE_TEL) { a.setAttribute('href', TEL_HREF); if (!a.getAttribute('aria-label')) a.setAttribute('aria-label', TEL_ARIA); a.setAttribute('data-site-tel', '1'); } }
      else if (/^sms:(site)?$/i.test(h)) { if (SITE_SMS) { a.setAttribute('href', SMS_HREF); a.setAttribute('data-site-sms', '1'); } }
      else if (/^#kakao$/i.test(h)) { if (KAKAO_URL) { a.setAttribute('href', KAKAO_URL); a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener'); a.setAttribute('data-site-kakao', '1'); } else a.hidden = true; }
    });
  }
  /* 전화 라인 아이콘(SVG · 선 1.6 · currentColor) : PC 헤더 번호 앞 18px · 모바일 헤더 22px — PNG 대신 벡터라 어떤 배율에서도 선명 */
  const PHONE_SVG = '<svg class="tel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.3 3.6h3.1l1.6 3.9-2 1.4a11.6 11.6 0 0 0 5.1 5.1l1.4-2 3.9 1.6v3.1a1.8 1.8 0 0 1-1.9 1.8A15.6 15.6 0 0 1 3.5 5.5a1.8 1.8 0 0 1 1.8-1.9z"/></svg>';
  /* 투명 헤더 사용 여부 (단일 기준) : 사이트 공통 헤더 설정 + 페이지별 "이 페이지에서 투명 헤더 사용" — 게시 데이터(cms.js)가 SITE_DATA.headerMode 로 전달.
     false 면 첫 화면이 이미지여도 항상 흰 헤더 · 값이 없으면(관리자 미연결) 투명 헤더 사용 */
  function headerTransparent() { return !(SITE_DATA.headerMode && SITE_DATA.headerMode.transparent === false); }
  const rawPage = isIndex ? 'index' : (params.get('page') || hashPage || '');
  const currentPage = (SITE_DATA.pageAliases && SITE_DATA.pageAliases[rawPage]) || rawPage;   /* 예전 ID 호환 (interior → hypert) */

  /* ---------------------------------------------------------------
     테마 적용 (SITE_DATA.theme → CSS 변수)
     --------------------------------------------------------------- */
  (function applyTheme() {
    const t = SITE_DATA.theme || {};
    const root = document.documentElement;
    if (t.fonts) {
      if (t.fonts.display) root.style.setProperty('--font-display', t.fonts.display);
      if (t.fonts.body) root.style.setProperty('--font-body', t.fonts.body);
    }
    [t.colors, t.typography, t.layout].forEach(function (group) {
      if (!group) return;
      Object.keys(group).forEach(function (k) {
        root.style.setProperty(k.indexOf('--') === 0 ? k : '--' + k, group[k]);
      });
    });
    root.style.setProperty('--animation-duration', (ANIM.duration || 1000) + 'ms');
    root.style.setProperty('--animation-delay-step', (ANIM.stagger || 140) + 'ms');
    /* 모바일(767px 이하) 헤더 높이 : layout["--header-height-mobile"] 이 있으면 화면 폭에 따라 --header-height 를 바꿉니다 (없으면 PC 값 그대로) */
    const layout = t.layout || {};
    const mobileHeader = layout['--header-height-mobile'];
    if (mobileHeader && window.matchMedia) {
      const mq = window.matchMedia('(max-width:767px)');
      const applyHeaderHeight = function () { root.style.setProperty('--header-height', mq.matches ? mobileHeader : (layout['--header-height'] || '92px')); };
      applyHeaderHeight();
      if (mq.addEventListener) mq.addEventListener('change', applyHeaderHeight); else if (mq.addListener) mq.addListener(applyHeaderHeight);
    }
  })();

  /* ---------------------------------------------------------------
     [공통 이미지 시스템] createLinkedImage
     ---------------------------------------------------------------
     사이트의 모든 이미지는 아래 한 가지 데이터 형식과 한 가지 함수로 만듭니다.
       media: {
         enabled: true,
         src: "./assets/images/a.jpg",      // 이미지 (assets/images/ 한 곳 · alt 는 파일명과 동일)
         mobileSrc: "assets/images/a-m.jpg",// 모바일(767px 이하) 전용 이미지 (없으면 src)
         alt: "이미지 설명",
         href: "",                          // 클릭 시 이동 주소 (비우면 링크 없음)
         target: "_self",                   // _blank 이면 rel="noopener" 자동
         ratio: "4 / 3",                    // 이미지 영역 비율
         objectFit: "cover",                // cover | contain
         objectPosition: "center center"    // 잘릴 때 초점
       }
     · 생성되는 DOM :
         <a|div class="editable-image"><picture><source media="(max-width:767px)"><img src alt></picture></a|div>
       → 개발자도구에서 img 의 src 만 바꾸면 즉시 교체됩니다.
     · src 가 비었거나 로딩에 실패해도 임시 이미지로 바꾸지 않고 영역(비율)만 유지합니다. (같은 이름의 파일을 올리면 바로 표시)

     · 문자열("assets/images/a.jpg")과 예전 표기(image / mobileImage / position)도 그대로 지원합니다.
     --------------------------------------------------------------- */
  const IMG_SET = SITE_DATA.imageSettings || {};
  const FALLBACK_IMAGE = '';   /* 임시 이미지(placeholder) 를 사용하지 않습니다 : 파일이 없으면 영역(비율)만 유지 */
  /* 파일명 (alt 는 항상 src 의 파일명과 같게 : 파일질라에서 같은 이름으로 덮어쓰기) */
  function fileNameOf(src) { const m = String(src || '').split('?')[0].split('#')[0].match(/([^\/]+)$/); return m ? m[1] : ''; }

  /* 기본 media 값 : 데이터에 media 가 없어도 항상 실제 <img> 가 생성되도록 사용합니다. */
  function defaultMedia(alt, ratio) {

  /* 객체에서 이미지 설정을 찾습니다. keys 순서대로(기본 media → 예전 키) 찾고,

    if (obj) {

        const v = obj[keys[i]];

        if (typeof v === 'string') return Object.assign(defaultMedia(alt, ratio), { src: v });
        if (typeof v === 'object') {
          if (v.enabled === false) return null;
          const out = Object.assign(defaultMedia(alt, ratio), v);
          out.enabled = true;
          out.src = String(v.src || v.image || '').trim() || FALLBACK_IMAGE;
          out.mobileSrc = String(v.mobileSrc || v.mobileImage || '').trim();
          out.alt = v.alt || alt || out.alt;
          out.ratio = v.ratio || ratio || '';

  function normalizeImage(cfg, defaults) {

      mobileSrc: String(cfg.mobileSrc || cfg.mobileImage || '').trim(),
      alt: fileNameOf(String(cfg.src || cfg.image || '').trim()) || cfg.alt || defaults.alt || '',   /* alt = 파일명 */
      ratio: cfg.ratio || defaults.ratio || '',
      objectFit: cfg.objectFit || IMG_SET.defaultObjectFit || 'cover',
      objectPosition: cfg.objectPosition || cfg.position || IMG_SET.defaultObjectPosition || 'center center',

  }

  /* <picture><source(모바일)><img></picture> 를 만듭니다. (모든 이미지가 이 한 곳을 거칩니다) */
  function buildPicture(info, label, onLoaded) {
    const frag = document.createDocumentFragment();
    /* HTML 소스에서 이미지 주소를 바로 찾을 수 있도록 주석을 함께 넣습니다. */
    frag.appendChild(document.createComment(' ' + (label || info.alt || '이미지') + ' : 아래 img 의 src 만 교체 '));
    const picture = document.createElement('picture');
    picture.className = 'editable-image__picture';
    if (info.mobileSrc) {
      const source = document.createElement('source');
      source.media = '(max-width: 767px)';
      source.srcset = info.mobileSrc;
      picture.appendChild(source);
    }
    const img = document.createElement('img');
    img.className = 'media__img content-image editable-image__img';
    img.alt = info.alt || '';
    img.loading = info.eager ? 'eager' : 'lazy';
    img.decoding = 'async';
    img.style.objectFit = info.objectFit || 'cover';
    img.style.objectPosition = info.objectPosition || 'center center';
    img.addEventListener('load', function () {
      img.classList.add('is-loaded');
      if (onLoaded) onLoaded();
    });
    /* 로딩 실패 → 이미지를 바꾸지 않고 is-missing 만 표시 (태그 · src · 영역 · 비율은 그대로 : 같은 이름의 파일을 올리면 바로 표시됨) */
    img.addEventListener('error', function () { img.classList.add('is-missing'); });
    picture.appendChild(img);
    /* src 는 <picture> 안에 넣은 뒤 지정 : 모바일에서는 <source> 가 먼저 선택되어 PC 이미지(hero.png 등)를 추가로 받지 않습니다. */
    if (info.src) img.src = info.src; else img.classList.add('is-missing');
    frag.appendChild(picture);
    return { frag: frag, picture: picture, img: img };
  }

  /* 실제 <img> 와 이미지 링크를 만드는 공통 함수 (모든 페이지 렌더러가 이 함수를 호출합니다)
       media      : 위 형식의 이미지 설정 (없으면 placeholder 로 생성)
       defaultAlt : alt 가 비었을 때 사용할 설명
       options    : { className, ratio, label, eager }
     반환 : <a|div class="editable-image"> 요소 · enabled:false 일 때만 null */
  function createLinkedImage(media, defaultAlt, options) {
    options = options || {};
    const config = (media == null || media === '') ? defaultMedia(defaultAlt, options.ratio) : media;
    const info = normalizeImage(config, { alt: defaultAlt, ratio: options.ratio, eager: options.eager });
    if (!info) return null;

    const wrapper = document.createElement(info.href ? 'a' : 'div');
    wrapper.className = 'editable-image media' +
      (info.href ? ' content-image-link' : ' content-image-wrap') +
      (options.className ? ' ' + options.className : '');
    if (info.href) {
      wrapper.href = normalizeUrl(info.href);
      wrapper.target = info.target || '_self';
      if (wrapper.target === '_blank') wrapper.rel = 'noopener noreferrer';
    }
    wrapper.style.aspectRatio = info.ratio || options.ratio || '4 / 3';

    wrapper.appendChild(built.frag);

  }

  /* 이미 있는 박스(.media) 안에 실제 <img> 를 넣습니다. (배경형 이미지 : 조감도 · 프리미엄 · 타입 배경 · 팝업 · 모달 등)
     enabled:false 여도 placeholder 를 넣습니다. 영역을 없애려면 호출하는 쪽에서 박스를 제거합니다. */

    if (!box) return;
    options = options || {};
