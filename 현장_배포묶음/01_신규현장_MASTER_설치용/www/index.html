<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>준비 중입니다</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: Pretendard, -apple-system, "Malgun Gothic", sans-serif; background: #0f172a; color: #e2e8f0; }
  .box { width: 100%; max-width: 560px; text-align: center; }
  h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: .02em; }
  p { margin: 0 0 8px; font-size: 14px; line-height: 1.8; color: #94a3b8; }
  .row { margin-top: 22px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  a { display: inline-block; padding: 11px 18px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 14px; }
  .a1 { background: #f8fafc; color: #0f172a; }
  .a2 { border: 1px solid #334155; color: #cbd5e1; }
  .steps { margin: 22px auto 0; max-width: 420px; text-align: left; font-size: 13px; line-height: 2; color: #cbd5e1; }
</style>
</head>
<body>
  <div class="box">
    <h1>홈페이지 준비 중입니다</h1>
    <p>통합웹빌더가 설치된 새 서버입니다. 아래 순서로 현장을 만들어 주세요.</p>
    <div class="steps">
      1. <b>/install/</b> 에서 현장명 · 대표번호 · 관리자 계정 만들기<br>
      2. 홈페이지 디자인 www 를 이 폴더에 덮어쓰기<br>
      3. <b>/admin/</b> → 에디터 → [공개 홈페이지에서 페이지 가져오기]<br>
      4. 방문예약 테스트 → 끝
    </div>
    <div class="row">
      <a class="a1" href="./install/">설치 시작 (/install/)</a>
      <a class="a2" href="./admin/">관리자 (/admin/)</a>
    </div>
  </div>
</body>
</html>
